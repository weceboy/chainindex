<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chainindex · Prompt Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1220;--panel:#101c2e;--alt:#0c1626;--elev:#17293f;--elev2:#1d3049;--border:#22354e;--soft:#1a2841;--text:#e8eef7;--muted:#8fa5c4;--dim:#5c7091;--accent:#2dd4bf;--accent2:#1f9c8c;--danger:#f87171;--dangerSoft:rgba(248,113,113,.14);--radius:12px;--font:'IBM Plex Sans',sans-serif;--display:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace;--sidebar:280px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{display:flex;height:100dvh}.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--alt);border-right:1px solid var(--soft);display:flex;flex-direction:column;min-height:0}.brand{padding:22px 20px 16px;font-family:var(--display);font-weight:700}.brand small{display:block;font:400 11px var(--font);color:var(--dim);margin-top:3px;text-transform:uppercase}.nav{padding:0 14px 12px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--soft)}.nav a{display:block;text-decoration:none;color:var(--muted);padding:9px 10px;border-radius:8px}.nav a:hover,.nav a.active{background:var(--elev);color:var(--accent)}.sidebar-tools{padding:14px 16px 10px;display:flex;gap:7px}.btn{border:1px solid var(--border);background:var(--elev);border-radius:8px;padding:8px 10px;font-size:12px}.btn:hover{border-color:var(--accent2);color:var(--accent)}.sidebar-tools .btn{flex:1}.folders{flex:1;overflow:auto;padding:0 12px 14px}.folder{margin:3px 0}.folder-head{display:flex;align-items:center;min-height:36px}.folder-toggle{flex:1;border:0;background:none;text-align:left;padding:7px;color:var(--text);font-weight:600;font-size:12.5px}.folder-actions{display:flex}.folder-actions button{width:25px;height:25px;border:0;background:transparent;color:var(--dim);border-radius:6px}.folder-actions button:hover{background:var(--elev);color:var(--text)}.folder-items{padding-left:19px}.folder-item{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:7px 8px;border-radius:7px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-item:hover,.folder-item.active{background:var(--elev);color:var(--accent)}.empty-folder{padding:6px 8px 8px 27px;color:var(--dim);font-size:10.5px;font-style:italic}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:76px;flex:0 0 76px;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--soft);background:rgba(10,18,32,.6);backdrop-filter:blur(10px)}.topbar h1{font:700 20px var(--display);margin:0;flex:1}.search{width:min(420px,45vw);padding:10px 13px;background:var(--alt);border:1px solid var(--border);border-radius:9px;outline:none}.search:focus{border-color:var(--accent2)}.content{flex:1;overflow:auto;padding:28px}.content-inner{max-width:1050px;margin:0 auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.toolbar-title{font:600 14px var(--display);color:var(--muted)}.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--soft);border-radius:16px;padding:17px;box-shadow:0 10px 28px -10px rgba(0,0,0,.45);display:flex;flex-direction:column;min-height:220px}.card h3{font:600 15px var(--display);margin:0 0 10px}.preview{font:13px/1.55 var(--font);color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;flex:1}.meta{font-size:10.5px;color:var(--dim);line-height:1.65;margin-top:13px}.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions .btn{flex:1}.danger:hover{color:var(--danger)!important;border-color:var(--danger)!important;background:var(--dangerSoft)!important}.empty{padding:55px 20px;text-align:center;border:1px dashed var(--border);border-radius:16px;color:var(--dim)}.empty strong{display:block;color:var(--muted);margin-bottom:6px}.overlay{position:fixed;inset:0;background:rgba(5,9,16,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.open{display:flex}.editor{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px}.editor h2{font:700 18px var(--display);margin:0 0 18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);font-weight:600}.field input,.field textarea,.field select{background:var(--alt);border:1px solid var(--border);border-radius:9px;padding:10px 12px;outline:none}.field textarea{min-height:270px;resize:vertical;font:13.5px/1.55 var(--mono)}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent2)}.editor-actions{display:flex;justify-content:flex-end;gap:9px}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032420;font-weight:600}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--elev2);border:1px solid var(--border);padding:10px 16px;border-radius:99px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.topbar{padding:0 16px}.content{padding:18px}.search{width:42vw}.prompt-grid{grid-template-columns:1fr}}.mobile-menu{display:none;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:8px 10px}@media(max-width:800px){.mobile-menu{display:block}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand">⛓ CHAININDEX<small>Prompt Manager</small></div><nav class="nav"><a href="./index.html">🔄 Workflows</a><a class="active" href="./prompt-manager.html">📝 Prompt Manager</a></nav><div class="sidebar-tools"><button class="btn" id="newPrompt">+ Neuer Prompt</button><button class="btn" id="newFolder">+ Neuer Ordner</button></div><div class="folders" id="folders"></div><div style="padding:12px 16px;border-top:1px solid var(--soft);display:flex;gap:7px"><button class="btn" id="exportBtn" style="flex:1">⭳ Export</button><label class="btn" style="flex:1;text-align:center">⭱ Import<input id="importInput" type="file" accept="application/json" hidden></label></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><h1>📝 Prompt Manager</h1><input class="search" id="search" type="search" placeholder="🔎 Prompts durchsuchen…"></header><section class="content"><div class="content-inner"><div class="toolbar"><div class="toolbar-title" id="folderTitle"></div><button class="btn primary" id="newPromptTop">+ Neuer Prompt</button></div><div class="prompt-grid" id="promptGrid"></div></div></section></main></div>
<div class="overlay" id="overlay"><form class="editor" id="editor"><h2 id="editorTitle">Neuer Prompt</h2><div class="field"><label for="promptTitle">Titel</label><input id="promptTitle" required></div><div class="field"><label for="promptContent">Prompt</label><textarea id="promptContent" required></textarea></div><div class="field"><label for="promptFolder">Ordner</label><select id="promptFolder"></select></div><div class="editor-actions"><button type="button" class="btn" id="cancelEdit">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></div></form></div><div class="toast" id="toast"></div>
<script src="./prompt-state.js"></script><script>
(function(){"use strict";
const KEY="pcb-state-v1",api=window.ChainIndexPromptState;let state,editingId=null,searchTerm="";
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function load(){try{state=api.migrateState(JSON.parse(localStorage.getItem(KEY)||"{}"));save()}catch(e){state=api.migrateState({});save()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function fmt(v){return new Date(v).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1700)}
function folderExpanded(id){return state.promptFolderExpanded[id]!==false}
function renderFolders(){
 const root=document.getElementById("folders");
 const folders=state.promptFolders.slice().sort((a,b)=>a.system?-1:b.system?1:a.name.localeCompare(b.name,"de",{sensitivity:"base"}));
 root.innerHTML=folders.map(f=>{const active=state.activePromptFolderId===f.id;const expanded=folderExpanded(f.id);const prompts=api.getPromptsForFolder(state,f.id);const items=expanded?prompts.map(p=>'<button class="folder-item '+(state.activePromptId===p.id?'active':'')+'" data-open="'+esc(p.id)+'">'+esc(p.title)+'</button>').join(""):"";const actions=f.system?"":'<span class="folder-actions"><button data-rename-folder="'+esc(f.id)+'" title="Umbenennen">✎</button><button data-delete-folder="'+esc(f.id)+'" title="Löschen">🗑</button></span>';return '<div class="folder" data-folder="'+esc(f.id)+'"><div class="folder-head"><button class="folder-toggle" data-toggle-folder="'+esc(f.id)+'">'+(expanded?'▼':'▶')+' 📁 '+esc(f.name)+'</button>'+actions+'</div><div class="folder-items">'+(expanded?(items||'<div class="empty-folder">Keine Prompts</div>'):"")+'</div></div>'}).join("");
}
function render(){
 state=api.migrateState(state);renderFolders();const grid=document.getElementById("promptGrid");const q=searchTerm.trim().toLowerCase();let prompts;if(q)prompts=Object.values(state.prompts).filter(p=>p.title.toLowerCase().includes(q)||p.content.toLowerCase().includes(q)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));else prompts=api.getPromptsForFolder(state,state.activePromptFolderId);document.getElementById("folderTitle").textContent=q?"Suchergebnisse für „"+searchTerm+"“":api.getPromptFolderById(state,state.activePromptFolderId).name;if(!prompts.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>'+ (q?'Keine Treffer':'Keine Prompts in diesem Ordner') +'</strong>'+ (q?'Titel und Inhalt werden durchsucht.':'Erstelle deinen ersten Prompt mit „Neuer Prompt“.')+'</div>';return}grid.innerHTML=prompts.map(p=>'<article class="card"><h3>'+esc(p.title)+'</h3><div class="preview">'+esc(p.content)+'</div><div class="meta">📁 '+esc(api.getPromptFolderById(state,p.folderId)?.name||'Unsortiert')+'<br>Erstellt: '+fmt(p.createdAt)+'<br>Geändert: '+fmt(p.updatedAt)+'</div><div class="card-actions"><button class="btn primary" data-edit="'+esc(p.id)+'">Öffnen</button><button class="btn" data-duplicate="'+esc(p.id)+'">Duplizieren</button><button class="btn danger" data-delete="'+esc(p.id)+'">Löschen</button></div></article>').join("");
}
function openEditor(id){editingId=id||null;const p=id?api.getPromptById(state,id):null;document.getElementById("editorTitle").textContent=p?"Prompt bearbeiten":"Neuer Prompt";document.getElementById("promptTitle").value=p?p.title:"";document.getElementById("promptContent").value=p?p.content:"";document.getElementById("promptFolder").innerHTML=state.promptFolders.map(f=>'<option value="'+esc(f.id)+'" '+((p?p.folderId:state.activePromptFolderId)===f.id?'selected':'')+'>'+esc(f.name)+'</option>').join("");document.getElementById("overlay").classList.add("open");document.getElementById("promptTitle").focus()}
function closeEditor(){document.getElementById("overlay").classList.remove("open");editingId=null}
function newPrompt(){openEditor(null)}
function createFolder(){const name=prompt("Name des neuen Prompt-Ordners:","");if(name==null)return;try{const f=api.createFolderOnState(state,name);state.activePromptFolderId=f.id;state.promptFolderExpanded[f.id]=true;save();render()}catch(e){alert(e.message)}}
function renameFolder(id){const f=api.getPromptFolderById(state,id);if(!f||f.system)return;const name=prompt("Ordner umbenennen:",f.name);if(name==null)return;try{api.renamePromptFolder(state,id,name);save();render()}catch(e){alert(e.message)}}
function deleteFolder(id){const f=api.getPromptFolderById(state,id);if(!f||f.system)return;const count=api.getPromptsForFolder(state,id).length;if(!confirm('Ordner „'+f.name+'“ löschen?'+(count?' '+count+' Prompts werden nach „Unsortiert“ verschoben.':'')))return;try{api.deletePromptFolder(state,id);save();render()}catch(e){alert(e.message)}}
function exportData(){const payload={app:"Chainindex",version:"4.0",exportedAt:new Date().toISOString(),workflowFolders:state.folders||[],workflows:Object.values(state.workflows||{}),promptFolders:state.promptFolders||[],prompts:Object.values(state.prompts||{})};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chainindex-export.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||typeof data!=="object")throw new Error("Ungültige Exportdatei.");if(Array.isArray(data.promptFolders))state.promptFolders=data.promptFolders;if(Array.isArray(data.prompts)){state.prompts={};data.prompts.forEach(p=>{if(p&&p.id)state.prompts[p.id]=p})}if(Array.isArray(data.workflowFolders))state.folders=data.workflowFolders;if(Array.isArray(data.workflows)){state.workflows={};data.workflows.forEach(w=>{if(w&&w.id)state.workflows[w.id]=w})}state=api.migrateState(state);save();render();toast("Import erfolgreich")}catch(e){alert(e.message||"Import fehlgeschlagen.")}};r.readAsText(file)}

document.getElementById("folders").addEventListener("click",e=>{const toggle=e.target.closest("[data-toggle-folder]");if(toggle){const id=toggle.dataset.toggleFolder;state.promptFolderExpanded[id]=!folderExpanded(id);state.activePromptFolderId=id;save();render();return}const open=e.target.closest("[data-open]");if(open){state.activePromptId=open.dataset.open;state.activePromptFolderId=api.getPromptById(state,state.activePromptId).folderId;save();openEditor(state.activePromptId);return}const rn=e.target.closest("[data-rename-folder]");if(rn){renameFolder(rn.dataset.renameFolder);return}const del=e.target.closest("[data-delete-folder]");if(del)deleteFolder(del.dataset.deleteFolder)});
document.getElementById("promptGrid").addEventListener("click",e=>{const edit=e.target.closest("[data-edit]"),dup=e.target.closest("[data-duplicate]"),del=e.target.closest("[data-delete]");if(edit)openEditor(edit.dataset.edit);if(dup){try{api.duplicatePrompt(state,dup.dataset.duplicate);save();render();toast("Prompt dupliziert")}catch(x){alert(x.message)}}if(del){const p=api.getPromptById(state,del.dataset.delete);if(p&&confirm('Prompt „'+p.title+'“ löschen?')){api.deletePrompt(state,p.id);save();render();toast("Prompt gelöscht")}}});
document.getElementById("editor").addEventListener("submit",e=>{e.preventDefault();try{const title=document.getElementById("promptTitle").value,content=document.getElementById("promptContent").value,folder=document.getElementById("promptFolder").value;if(editingId)api.updatePrompt(state,editingId,title,content,folder);else{const p=api.createPrompt(title,content,folder);state.prompts[p.id]=p;state.activePromptId=p.id;state.activePromptFolderId=p.folderId}save();closeEditor();render();toast("Prompt gespeichert")}catch(x){alert(x.message)}});
document.getElementById("cancelEdit").onclick=closeEditor;document.getElementById("newPrompt").onclick=newPrompt;document.getElementById("newPromptTop").onclick=newPrompt;document.getElementById("newFolder").onclick=createFolder;document.getElementById("search").oninput=e=>{searchTerm=e.target.value;render()};document.getElementById("exportBtn").onclick=exportData;document.getElementById("importInput").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""};document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
load();render();
})();
</script>
</body></html>
