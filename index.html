<style>
:root{--bg-deep:#0a1220;--bg-panel:#101c2e;--bg-panel-alt:#0c1626;--bg-elevated:#17293f;--bg-elevated-2:#1d3049;--border:#22354e;--border-soft:#1a2841;--text-primary:#e8eef7;--text-secondary:#8fa5c4;--text-tertiary:#5c7091;--accent:#2dd4bf;--accent-dim:#1f9c8c;--accent-soft:rgba(45,212,191,.14);--danger:#f87171;--danger-soft:rgba(248,113,113,.14);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--shadow-md:0 10px 28px -10px rgba(0,0,0,.55);--shadow-lg:0 24px 60px -20px rgba(0,0,0,.65);--font-display:'Sora',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;--sidebar-w:280px;--topbar-h:76px}*,*::before,*::after{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:var(--bg-deep);overflow:hidden}button,input,textarea{font-family:inherit;color:inherit}button{cursor:pointer}body::before{content:"";position:fixed;inset:0;background:radial-gradient(70% 55% at 12% -8%,rgba(45,212,191,.1),transparent 60%),radial-gradient(60% 45% at 100% 0%,rgba(56,189,248,.08),transparent 55%);pointer-events:none}.app{position:relative;z-index:1;display:flex;height:100vh;height:100dvh}.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--bg-panel-alt);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;min-height:0}.sidebar-header{padding:22px 20px 14px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--accent),#38bdf8);display:flex;align-items:center;justify-content:center;font-size:18px}.brand-text{font-family:var(--font-display);font-weight:700;font-size:15.5px}.brand-text small{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:var(--text-tertiary);text-transform:uppercase;margin-top:2px}.btn-new-workflow{margin:6px 16px 14px;padding:11px 14px;border-radius:var(--radius-md);border:1px dashed var(--border);background:transparent;color:var(--text-secondary);font-size:13.5px}.btn-new-workflow:hover{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-soft)}.workflow-list{flex:1;overflow-y:auto;padding:2px 12px 12px;display:flex;flex-direction:column;gap:4px}.workflow-item{display:flex;align-items:stretch;border-radius:var(--radius-sm)}.workflow-item:hover{background:var(--bg-elevated)}.workflow-item.is-active{background:var(--bg-elevated-2)}.workflow-select{flex:1;min-width:0;background:none;border:none;text-align:left;padding:10px 8px 10px 14px;display:flex;flex-direction:column;gap:2px}.workflow-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workflow-item.is-active .workflow-name{color:var(--accent)}.workflow-meta{font-size:11px;color:var(--text-tertiary)}.workflow-item-actions{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 2px}.icon-btn-sm,.icon-btn{border:0;background:transparent;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center}.icon-btn-sm{width:26px;height:26px;border-radius:7px}.icon-btn-sm:hover{background:var(--bg-panel);color:var(--text-primary)}.icon-btn-danger:hover{color:var(--danger);background:var(--danger-soft)}.workflow-name-input{width:100%;background:var(--bg-deep);border:1px solid var(--accent-dim);border-radius:6px;padding:5px 8px}.workflow-empty{padding:24px 14px;text-align:center;color:var(--text-tertiary);font-size:12.5px;line-height:1.6}.sidebar-footer{padding:14px 16px 18px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:10px}.btn-import{padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-panel);color:var(--text-secondary);font-size:12.5px;text-align:center}.sidebar-hint{font-size:10.5px;color:var(--text-tertiary);text-align:center}.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}.topbar{height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid var(--border-soft);background:rgba(10,18,32,.55);backdrop-filter:blur(10px)}.hamburger{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--bg-panel)}.topbar-title-wrap{flex:1;min-width:0}.workflow-title-input{width:100%;background:none;border:none;font-family:var(--font-display);font-weight:700;font-size:20px;padding:4px 2px}.topbar-meta{font-size:12px;color:var(--text-tertiary)}.steps-scroll{flex:1;overflow-y:auto;padding:28px}.steps-container{max-width:1180px;margin:0 auto;display:flex;flex-direction:column}.empty-state{max-width:420px;margin:10vh auto 0;text-align:center;padding:40px 32px;border:1px dashed var(--border);border-radius:var(--radius-lg)}.empty-state p{color:var(--text-secondary);font-size:13.5px;line-height:1.6;margin:8px 0 20px}.btn-primary{padding:11px 20px;border-radius:var(--radius-sm);border:0;background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#032420;font-weight:600}.step-card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}.step-header{display:flex;align-items:center;gap:10px;padding:14px 16px}.drag-handle{cursor:grab;color:var(--text-tertiary);font-size:16px}.step-badge{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}.step-title-input{flex:1;min-width:0;background:none;border:none;font-family:var(--font-display);font-weight:600;font-size:15px;padding:6px 8px}.step-header-actions{display:flex;gap:4px}.icon-btn{width:32px;height:32px;border-radius:9px;font-size:14px}.step-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 18px 18px}.step-body.is-collapsed{display:none}.field-col{display:flex;flex-direction:column;min-width:0;gap:8px}.field-right{gap:14px}.field-block{display:flex;flex-direction:column;gap:8px}.field-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.field-label-row label{font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-tertiary)}.field-hint{font-size:11px;color:var(--text-tertiary)}textarea{width:100%;resize:none;border-radius:var(--radius-md);padding:12px 36px 12px 14px;font-size:13.5px;line-height:1.55;background:var(--bg-panel-alt);border:1px solid var(--border);min-height:96px}.field-input textarea{min-height:220px}.ta-template{font-family:var(--font-mono);min-height:110px}.ta-output{font-family:var(--font-mono);min-height:100px;color:var(--text-secondary)}.textarea-wrap{position:relative}.clear-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border:0;border-radius:6px;background:var(--bg-elevated);display:none}.textarea-wrap.has-content .clear-btn{display:flex;align-items:center;justify-content:center}.field-counter{font-size:10.5px;color:var(--text-tertiary);font-family:var(--font-mono)}.mini-btn,.copy-btn,.connector-toggle,.btn-add-step{border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);border-radius:8px;padding:6px 10px}.copy-btn{position:absolute;right:10px;bottom:10px}.connector{display:flex;align-items:center;justify-content:center;gap:10px;height:46px}.connector-line{flex:1;max-width:120px;height:1px;background:var(--border)}.connector.is-active .connector-line{background:var(--accent)}.connector.is-active .connector-toggle{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-dim)}.btn-add-step{margin:22px auto 0;width:100%;border-style:dashed;background:transparent}.modal-backdrop{position:fixed;inset:0;background:rgba(5,9,16,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal-backdrop.is-open{display:flex}.modal{width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-lg)}.modal p{font-size:13px;color:var(--text-secondary);line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.btn-secondary,.btn-danger{padding:9px 16px;border-radius:var(--radius-sm);font-size:13px}.btn-secondary{border:1px solid var(--border);background:transparent}.btn-danger{border:0;background:var(--danger);color:#2a0a0a}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-elevated-2);border:1px solid var(--border);padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;z-index:200}.toast.is-visible{opacity:1;transform:translateX(-50%)}@media(max-width:1024px){.step-body{grid-template-columns:1fr}}@media(max-width:860px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);z-index:30;transition:transform .28s}.sidebar.is-open{transform:translateX(0)}.hamburger{display:flex}.topbar{padding:0 16px}.steps-scroll{padding:18px 16px 90px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="brand"><div class="brand-icon">⛓</div><div class="brand-text">Prompt Chain Builder<small>Kettenwerkzeug</small></div></div></div><button class="btn-new-workflow" id="newWorkflowBtn" type="button">+ Neuer Workflow</button><div class="workflow-list" id="workflowList"></div><div class="sidebar-footer"><label class="btn-import" for="importInput">⭱ Workflow importieren</label><input type="file" id="importInput" accept="application/json" hidden><div class="sidebar-hint">Alle Daten bleiben lokal in diesem Browser gespeichert.</div></div></aside><main class="main"><header class="topbar"><button class="hamburger" id="hamburgerBtn" type="button">☰</button><div class="topbar-title-wrap"><input class="workflow-title-input" id="workflowTitleInput" type="text" spellcheck="false"><div class="topbar-meta" id="topbarMeta"></div></div></header><div class="steps-scroll"><div class="steps-container" id="stepsContainer"></div></div></main></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h3 id="modalTitle">Titel</h3><p id="modalMessage">Nachricht</p><div class="modal-actions"><button class="btn-secondary" id="modalCancel">Abbrechen</button><button class="btn-danger" id="modalConfirm">Löschen</button></div></div></div><div class="toast" id="toast"></div>
<script src="./folder-state.js"></script>
<script>
(function(){"use strict";
const STORAGE_KEY="pcb-state-v1",folders=window.ChainIndexFolderState;let state=null,saveTimer=null,toastTimer=null;
function uid(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():"id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function makeStep(n,o){return Object.assign({id:uid(),title:"Schritt "+n,input:"",template:"",collapsed:false,chainToNext:false},o||{})}
function makeWorkflow(name,steps,folderId){const t=Date.now();return{id:uid(),name:name||"Neuer Workflow",createdAt:t,updatedAt:t,folderId:folderId||folders.SYSTEM_FOLDER_ID,steps:steps&&steps.length?steps:[makeStep(1)]}}
function seedState(){const a=makeWorkflow("YouTube Video Prozess",[makeStep(1,{title:"Recherche & Hook",input:"Thema: Nachhaltige Ernährung für Einsteiger, Zielgruppe: 20-35 Jahre",template:"Du bist ein erfahrener YouTube-Stratege. Entwickle 5 knackige Hook-Ideen:\n\n[PROMPTFELD1]",chainToNext:true}),makeStep(2,{title:"Skript-Entwurf",template:"Schreibe daraus ein Skript für ein 60-Sekunden-Kurzvideo:\n\n[PROMPTFELD2]"})]);const b=makeWorkflow("E-Mail Outbound",[makeStep(1,{title:"Zielperson analysieren",input:"Firma: Musterbau GmbH, Rolle: Head of Operations",template:"Fasse typische Herausforderungen zusammen:\n\n[PROMPTFELD1]"})]);return folders.migrateState({activeWorkflowId:a.id,activeFolderId:folders.SYSTEM_FOLDER_ID,workflows:{[a.id]:a,[b.id]:b}})}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?folders.migrateState(JSON.parse(raw)):seedState()}catch(e){console.warn("Konnte gespeicherten Zustand nicht laden.",e);return seedState()}}
function saveStateNow(){try{state=folders.migrateState(state);localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn("Speichern fehlgeschlagen.",e)}}
function saveStateDebounced(){clearTimeout(saveTimer);saveTimer=setTimeout(saveStateNow,250)}
function getActiveWorkflow(){return state.workflows[state.activeWorkflowId]||null}
function touch(w){w.updatedAt=Date.now()}
function getFolderById(id){return folders.getFolderById(state,id)}function getWorkflowsForFolder(id){return folders.getWorkflowsForFolder(state,id)}
function createFolder(name){const f=folders.createFolder(name);state.folders.push(f);saveStateNow();return f}function renameFolder(id,name){const f=folders.renameFolder(state,id,name);saveStateNow();return f}function deleteFolder(id){const f=folders.deleteFolder(state,id);saveStateNow();return f}function moveWorkflowToFolder(id,folderId){const w=folders.moveWorkflowToFolder(state,id,folderId);saveStateNow();return w}
window.createFolder=createFolder;window.renameFolder=renameFolder;window.deleteFolder=deleteFolder;window.moveWorkflowToFolder=moveWorkflowToFolder;window.getFolderById=getFolderById;window.getWorkflowsForFolder=getWorkflowsForFolder;
const $=id=>document.getElementById(id),sidebar=$("sidebar"),list=$("workflowList"),title=$("workflowTitleInput"),meta=$("topbarMeta"),steps=$("stepsContainer"),modal=$("modalBackdrop"),modalTitle=$("modalTitle"),modalMessage=$("modalMessage"),modalCancel=$("modalCancel"),modalConfirm=$("modalConfirm"),toast=$("toast");
function showToast(m){toast.textContent=m;toast.classList.add("is-visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("is-visible"),2200)}
function confirmBox(t,m,label){modalTitle.textContent=t;modalMessage.textContent=m;modalConfirm.textContent=label||"Löschen";modal.classList.add("is-open");return new Promise(r=>{const done=v=>{modal.classList.remove("is-open");modalConfirm.onclick=modalCancel.onclick=null;r(v)};modalConfirm.onclick=()=>done(true);modalCancel.onclick=()=>done(false)})}
function renderSidebar(){const items=Object.values(state.workflows).sort((a,b)=>b.updatedAt-a.updatedAt);list.innerHTML=items.length?items.map(w=>'<div class="workflow-item '+(w.id===state.activeWorkflowId?'is-active':'')+'" data-id="'+w.id+'"><button class="workflow-select" data-action="select"><span class="workflow-name">'+esc(w.name)+'</span><span class="workflow-meta">'+w.steps.length+(w.steps.length===1?' Schritt':' Schritte')+'</span></button><div class="workflow-item-actions"><button class="icon-btn-sm" data-action="rename">✎</button><button class="icon-btn-sm" data-action="export">⭳</button><button class="icon-btn-sm icon-btn-danger" data-action="delete">🗑</button></div></div>').join(""):'<div class="workflow-empty">Noch keine Workflows vorhanden.</div>'}
list.addEventListener("click",async e=>{const item=e.target.closest(".workflow-item");if(!item)return;const w=state.workflows[item.dataset.id],a=e.target.closest("[data-action]");if(!a){setActive(w.id);return}if(a.dataset.action==="select")setActive(w.id);if(a.dataset.action==="rename")renameWorkflow(item,w);if(a.dataset.action==="export")exportWorkflow(w);if(a.dataset.action==="delete"&&await confirmBox("Workflow löschen","Alle Schritte gehen dabei verloren.","Löschen"))deleteWorkflow(w.id)})
function renameWorkflow(item,w){const s=item.querySelector(".workflow-name"),i=document.createElement("input");i.className="workflow-name-input";i.value=w.name;s.replaceWith(i);i.focus();i.select();i.onblur=()=>{w.name=i.value.trim()||"Unbenannter Workflow";touch(w);saveStateNow();renderSidebar();if(w.id===state.activeWorkflowId)syncTopbar()};i.onkeydown=e=>{if(e.key==="Enter")i.blur();if(e.key==="Escape"){i.value=w.name;i.blur()}}}
function setActive(id){if(!state.workflows[id])return;state.activeWorkflowId=id;state.activeFolderId=state.workflows[id].folderId||folders.SYSTEM_FOLDER_ID;saveStateNow();renderSidebar();renderMain()}
function newWorkflow(){const w=makeWorkflow("Neuer Workflow",null,folders.SYSTEM_FOLDER_ID);state.workflows[w.id]=w;state.activeWorkflowId=w.id;state.activeFolderId=w.folderId;saveStateNow();renderSidebar();renderMain();title.focus();title.select()}
$("newWorkflowBtn").onclick=newWorkflow;$("hamburgerBtn").onclick=()=>sidebar.classList.toggle("is-open");
async function deleteWorkflow(id){delete state.workflows[id];const x=Object.values(state.workflows).sort((a,b)=>b.updatedAt-a.updatedAt)[0];state.activeWorkflowId=x?x.id:null;state.activeFolderId=x?x.folderId:folders.SYSTEM_FOLDER_ID;saveStateNow();renderSidebar();renderMain();showToast("Workflow gelöscht")}
function downloadJson(filename,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportWorkflow(w){downloadJson((w.name||"workflow").toLowerCase().replace(/[^a-z0-9äöüß\-_ ]/g,"").trim().replace(/\s+/g,"-").slice(0,60)+".json",{app:"prompt-chain-builder",version:2,exportedAt:new Date().toISOString(),workflow:w})}
$("importInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),incoming=[];if(Array.isArray(data))incoming.push(...data);else if(data.workflows&&typeof data.workflows==="object")incoming.push(...Object.values(data.workflows));else if(data.workflow)incoming.push(data.workflow);else if(data.steps)incoming.push(data);else throw Error("Unbekanntes Format");let last=null;incoming.forEach(raw=>{const steps2=Array.isArray(raw.steps)&&raw.steps.length?raw.steps.map((s,i)=>makeStep(i+1,s)):[makeStep(1)];const w=makeWorkflow(raw.name||"Importierter Workflow",steps2,raw.folderId&&getFolderById(raw.folderId)?raw.folderId:folders.SYSTEM_FOLDER_ID);state.workflows[w.id]=w;last=w.id});if(last){state.activeWorkflowId=last;state.activeFolderId=state.workflows[last].folderId}saveStateNow();renderSidebar();renderMain();showToast("Workflow importiert")}catch(err){console.warn(err);await confirmBox("Import fehlgeschlagen","Die Datei konnte nicht gelesen werden.","OK")}e.target.value=""})
function syncTopbar(){const w=getActiveWorkflow();title.value=w?w.name:"";title.disabled=!w;if(w)meta.innerHTML="<strong>"+w.steps.length+"</strong> "+(w.steps.length===1?"Schritt":"Schritte")+" · Ordner: "+esc((getFolderById(w.folderId)||getFolderById(folders.SYSTEM_FOLDER_ID)).name);else meta.textContent=""}
title.oninput=()=>{const w=getActiveWorkflow();if(!w)return;w.name=title.value;touch(w);saveStateDebounced()};title.onblur=()=>{const w=getActiveWorkflow();if(w){w.name=w.name.trim()||"Unbenannter Workflow";saveStateNow();renderSidebar()}}
function output(s){return s.template?s.template.replace(/\[PROMPTFELD\d+\]/g,s.input||""):""}function recompute(w){w.steps.forEach((s,i)=>{if(s.chainToNext&&w.steps[i+1])w.steps[i+1].input=output(s)})}
function cardHtml(s,i,n){let h='<div class="step-card" data-index="'+i+'"><div class="step-header"><span class="drag-handle">⠿⠿</span><span class="step-badge">'+(i+1)+'</span><input class="step-title-input" value="'+esc(s.title)+'"><div class="step-header-actions"><button class="icon-btn" data-action="collapse">▾</button><button class="icon-btn icon-btn-danger" data-action="delete">🗑</button></div></div><div class="step-body '+(s.collapsed?'is-collapsed':'')+'"><div class="field-col field-input"><div class="field-label-row"><label>Input</label><span class="field-hint">Text oder Ergebnis aus Vorstufe</span></div><div class="textarea-wrap"><textarea class="ta-input">'+esc(s.input)+'</textarea><button class="clear-btn" data-action="clear">×</button></div><div class="field-counter input-counter"></div></div><div class="field-col field-right"><div class="field-block"><div class="field-label-row"><label>Prompt-Vorlage</label><button class="mini-btn" data-action="placeholder">+ [PROMPTFELD'+(i+1)+']</button></div><div class="textarea-wrap"><textarea class="ta-template">'+esc(s.template)+'</textarea><button class="clear-btn" data-action="clear-template">×</button></div><div class="field-counter template-counter"></div></div><div class="field-block"><div class="field-label-row"><label>Fertiger Prompt</label></div><div class="textarea-wrap"><textarea class="ta-output" readonly>'+esc(output(s))+'</textarea><button class="copy-btn" data-action="copy">📋 Kopieren</button></div><div class="field-counter output-counter"></div></div></div></div></div>';if(i<n-1)h+='<div class="connector '+(s.chainToNext?'is-active':'')+'" data-index="'+i+'"><div class="connector-line"></div><button class="connector-toggle" data-action="chain">'+(s.chainToNext?'🔗 Verkettet':'⛓️‍💥 Verketten')+'</button><div class="connector-line"></div></div>';return h}
function renderMain(){syncTopbar();const w=getActiveWorkflow();if(!w){steps.innerHTML='<div class="empty-state"><h2>Kein Workflow ausgewählt</h2><p>Erstelle einen neuen Workflow, um deine erste Prompt-Kette zu bauen.</p><button class="btn-primary" id="emptyCreateBtn">+ Workflow erstellen</button></div>';$('emptyCreateBtn').onclick=newWorkflow;return}recompute(w);steps.innerHTML=w.steps.map((s,i)=>cardHtml(s,i,w.steps.length)).join("")+'<button class="btn-add-step" id="addStepBtn">+ Weiteren Schritt hinzufügen</button>';$('addStepBtn').onclick=addStep;steps.querySelectorAll("textarea").forEach(x=>{x.style.height="auto";x.style.height=x.scrollHeight+"px"})}
function addStep(){const w=getActiveWorkflow();if(!w)return;w.steps.push(makeStep(w.steps.length+1));touch(w);saveStateNow();renderSidebar();renderMain()}
steps.addEventListener("input",e=>{const c=e.target.closest(".step-card");if(!c)return;const w=getActiveWorkflow(),s=w.steps[+c.dataset.index];if(e.target.classList.contains("ta-input"))s.input=e.target.value;if(e.target.classList.contains("ta-template"))s.template=e.target.value;if(e.target.classList.contains("step-title-input"))s.title=e.target.value;touch(w);saveStateDebounced();const o=c.querySelector(".ta-output");if(o)o.value=output(s)})
steps.addEventListener("click",async e=>{const c=e.target.closest(".step-card"),a=e.target.closest("[data-action]");if(a&&a.dataset.action==="chain"){const w=getActiveWorkflow(),i=+a.closest(".connector").dataset.index;w.steps[i].chainToNext=!w.steps[i].chainToNext;touch(w);saveStateNow();renderMain();return}if(!c||!a)return;const w=getActiveWorkflow(),i=+c.dataset.index,s=w.steps[i];if(a.dataset.action==="collapse"){s.collapsed=!s.collapsed;saveStateNow();renderMain()}if(a.dataset.action==="clear"){s.input="";saveStateNow();renderMain()}if(a.dataset.action==="clear-template"){s.template="";saveStateNow();renderMain()}if(a.dataset.action==="placeholder"){const t=c.querySelector(".ta-template"),token="[PROMPTFELD"+(i+1)+"]",p=t.selectionStart||t.value.length;t.value=t.value.slice(0,p)+token+t.value.slice(t.selectionEnd||p);t.dispatchEvent(new Event("input"));t.focus()}if(a.dataset.action==="copy"){navigator.clipboard?.writeText(c.querySelector(".ta-output").value);showToast("Prompt kopiert")}if(a.dataset.action==="delete"&&await confirmBox("Schritt löschen","Eingegebener Text geht dabei verloren.","Löschen")){w.steps.splice(i,1);if(!w.steps.length)w.steps.push(makeStep(1));touch(w);saveStateNow();renderSidebar();renderMain()}})
function init(){state=loadState();if(!state.activeWorkflowId||!state.workflows[state.activeWorkflowId]){const w=Object.values(state.workflows)[0];state.activeWorkflowId=w?w.id:null}state.activeFolderId=state.workflows[state.activeWorkflowId]?.folderId||folders.SYSTEM_FOLDER_ID;saveStateNow();renderSidebar();renderMain();window.addEventListener("beforeunload",saveStateNow)}init();
})();
</script>
</body>
</html>
